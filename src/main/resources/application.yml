server:
  port: 8090
spring:
  application:
    name: kafka-demo





  datasource:
    url: jdbc:mysql://localhost:3308/kafka_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: kafka
    password: kafka123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8





  # ==============================
  # Kafka
  # ==============================
  kafka:
    # Kafka Broker 地址。
    # Spring Boot 运行在 Windows 宿主机，
    # 所以这里通过 localhost:9092 访问 Kafka。
    bootstrap-servers:
      - localhost:9092
    listener:
      # 暂时使用手动立即确认，用于观察 Offset Commit。
      ack-mode: manual_immediate




    # ==================================================
    # Kafka Producer
    # ==================================================
    # producer:
    # ==================================================
    # Producer Serializer
    # ==================================================
    # Key / Value Serializer 不再直接配置在 application.yml。
    # 原因：
    # 当前 Producer 需要根据消息 Java 类型 “动态” （重点）选择 Serializer：
    # String            -> StringSerializer
    # OrderCreatedEvent -> JsonSerializer
    # byte[]            -> ByteArraySerializer
    # 具体配置见：KafkaProducerConfig.java


    # ==================================================
    # Kafka Consumer
    # ==================================================
    #    consumer:
    #      group-id: order-service
    #      auto-offset-reset: earliest
    #      key-deserializer:
    #        org.apache.kafka.common.serialization.StringDeserializer
    #      value-deserializer:
    #        org.springframework.kafka.support.serializer.JsonDeserializer
    #      properties:
    #        spring.json.trusted.packages: com.example.event
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      # 外层不再直接使用真正的反序列化器，
      # 而是先交给 Spring Kafka 的异常处理反序列化器。
      key-deserializer:
        org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer:
        org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # Key 真正的反序列化器
        spring.deserializer.key.delegate.class:
          org.apache.kafka.common.serialization.StringDeserializer
        # Value 真正的反序列化器
        spring.deserializer.value.delegate.class:
          org.springframework.kafka.support.serializer.JsonDeserializer
        # JsonDeserializer 允许反序列化的 Java 包
        spring.json.trusted.packages:
          com.example.event
        # 当消息没有 Spring Kafka 的类型 Header 时，
        # 默认按照 OrderCreatedEvent 进行反序列化。
        # 这一条非常适合我们等会儿从 Kafbat 手动生产坏消息。
        spring.json.value.default.type:
          com.example.event.OrderCreatedEvent






  # ==============================
  # Docker Compose
  # ==============================
  docker:
    compose:
      # 开启 Spring Boot Docker Compose 支持
      enabled: true
      # Spring Boot 启动：
      #   自动启动 docker-compose.yml
      # Spring Boot 停止：
      #   自动 stop Kafka
      lifecycle-management: start-and-stop