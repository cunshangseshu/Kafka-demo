server:
  port: 8090
spring:
  application:
    name: kafka-demo





  datasource:
    url: jdbc:mysql://localhost:3308/kafka_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: kafka
    password: kafka123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8





  # ==============================
  # Kafka
  # ==============================
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual_immediate




    # ==================================================
    # Kafka Producer
    # ==================================================
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.event
        spring.json.value.default.type: com.example.event.OrderCreatedEvent






  # ==============================
  # Docker Compose
  # ==============================
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

demo:
  kafka:
    consumer:
      processing-delay-ms: 0