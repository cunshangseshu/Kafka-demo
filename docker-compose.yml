services:
  # ==========================================================
  # Kafka
  # ==========================================================
  kafka:
    # Apache Kafka 官方镜像
    image: apache/kafka:4.3.1
    # Docker 容器名称
    container_name: kafka-learning
    # Docker 网络内部主机名
    # Kafbat UI 后面会通过：
    # kafka:19092 找到当前 Kafka Broker。
    hostname: kafka
    ports:
      # ------------------------------------------------------
      # Windows 宿主机访问 Kafka
      # ------------------------------------------------------
      # Spring Boot：localhost:9092
      - "9092:9092"
    environment:
      # ======================================================
      # KRaft 基础配置
      # ======================================================
      # 当前 Kafka 节点编号
      KAFKA_NODE_ID: 1
      # 当前节点同时承担： broker、controller
      # 学习环境采用单节点 Combined Mode。
      KAFKA_PROCESS_ROLES: "broker,controller"
      # ======================================================
      # Listener
      # ======================================================
      # 定义不同 Listener 使用的安全协议。
      # 当前学习环境全部使用 PLAINTEXT，暂时不加入 SSL / SASL。
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      # Kafka Broker 真正监听的地址。
      # 29093：KRaft Controller 内部通信
      # 9092：Windows 宿主机访问
      # 19092：Docker 网络内部访问
      KAFKA_LISTENERS: >
        CONTROLLER://:29093,
        PLAINTEXT_HOST://:9092,
        PLAINTEXT://:19092
      # Kafka 告诉客户端：“以后你应该通过什么地址找我？”
      # Windows Java：localhost:9092
      # Docker 内部：kafka:19092
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT_HOST://localhost:9092,
        PLAINTEXT://kafka:19092
      # Broker 之间通信使用哪个 Listener。
      # 当前虽然只有一个 Broker，但 Kafka 仍然要求明确配置。
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # KRaft Controller 使用哪个 Listener。
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # ======================================================
      # KRaft Controller
      # ======================================================
      # Controller Quorum 配置：nodeId@host:port
      # 当前：
      # Node 1
      # ↓
      # kafka:29093
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:29093
      # Kafka Cluster ID。
      # 学习环境固定一个 ID，保证 Compose 配置具有可重复性。
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # ======================================================
      # 单 Broker 环境需要调整的内部 Topic 副本数量
      # ======================================================
      # Consumer Group Offset 内部 Topic
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Transaction State Log
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Consumer Group 初始 Rebalance 等待时间
      # 学习环境设为 0，避免每次 Consumer 启动以后等待太久。
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Kafka 4.x Share Group 相关内部 Topic
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    # --------------------------------------------------------
    # Kafka 健康检查
    # --------------------------------------------------------
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  # ==========================================================
  # Kafbat UI
  # ==========================================================
  kafbat-ui:
    # 固定版本，避免使用 latest 导致未来环境漂移
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      # 浏览器访问：http://localhost:8080
      - "8080:8080"
    environment:
      # UI 中显示的 Kafka Cluster 名字
      KAFKA_CLUSTERS_0_NAME: kafka-learning
      # ------------------------------------------------------
      # 特别重要
      # ------------------------------------------------------
      # 这里绝对不能写：localhost:9092
      # 因为 Kafbat UI 自己也是一个 Docker 容器。对它来说：localhost = Kafbat UI 自己，所以必须通过 Docker 网络访问：kafka:19092
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      # 开启动态配置能力
      DYNAMIC_CONFIG_ENABLED: "true"
      # 顺便开启 Swagger UI，
      # 后面有兴趣可以观察 Kafbat 自己的 API。
      SWAGGER_UI_ENABLED: "true"
    depends_on:
      kafka:
        # Kafka 真正 Healthy 以后
        # 才启动 Kafka UI。
        condition: service_healthy